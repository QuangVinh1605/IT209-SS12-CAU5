name: CI Pipeline - Broken

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Run Gradle Tests & Package JAR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      # LỖI 1: Thiếu bước phân quyền thực thi cho Gradle Wrapper (chmod +x gradlew)
      - name: Run JUnit Tests & Package JAR
        run: ./gradlew test bootJar

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: build/libs/app.jar
          retention-days: 1

  docker-build:
    name: Build and Push Docker Image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: build/libs

      - name: Set Lowercase Image Name
        run: |
          echo "IMAGE_NAME=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      # LỖI 2: Sai chính tả tên biến Secret (REGISTRY_TOKKEN thay vì REGISTRY_TOKEN)
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_TOKKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # LỖI 3: Sai ngữ cảnh Build context (context: ./build thay vì context: .)
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./build
          file: ./Dockerfile
          push: true
          tags: ${{ env.IMAGE_NAME }}:latest
